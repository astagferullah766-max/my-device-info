<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Info</title>
<style>
body {
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
  max-width: 700px;
  margin: auto;
}
h1 { color: #64e8c1; text-align: center; }
button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border: 0;
  border-radius: 10px;
  background: #64e8c1;
  font-size: 16px;
  cursor: pointer;
}
.card {
  background: #1c2536;
  padding: 15px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.item {
  padding: 12px 0;
  border-bottom: 1px solid #354156;
}
.key { color: #64e8c1; }
.value { display: block; margin-top: 7px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>📱 معلومات الجهاز</h1>
<p>اضغط على الزر لعرض معلومات جهازك. بعض المعلومات قد لا تكون متاحة.</p>
<button onclick="showInfo()">عرض معلومات الجهاز</button>
<button onclick="getLocation()">تحديد الموقع الدقيق (اختياري)</button>
<div id="result" class="card">بانتظار الضغط على الزر...</div>

<script>
function add(label, value, emoji = "📌") {
  const row = document.createElement("div");
  row.className = "item";
  const key = document.createElement("span");
  key.className = "key";
  key.textContent = emoji + " " + label;
  const val = document.createElement("span");
  val.className = "value";
  val.textContent = value ?? "غير متاح";
  row.append(key, val);
  document.getElementById("result").appendChild(row);
}

async function showInfo() {
  const r = document.getElementById("result");
  r.replaceChildren();
  const n = navigator;
  const ua = n.userAgent || "غير متاح";

  add("عنوان المتصفح", ua, "📜");
  add("النظام / المنصة", n.platform, "🖥");
  add("نوع الجهاز", /Android|iPhone|Mobile/i.test(ua) ? "هاتف أو جهاز محمول" : "حاسوب أو جهاز آخر", "📱");
  add("لغة المتصفح", n.language, "🌐");
  add("عدد الأنوية المتاح", n.hardwareConcurrency, "⚙️");
  add("ذاكرة RAM التقريبية (GB)", n.deviceMemory, "🧠");
  add("دقة الشاشة", screen.width + " × " + screen.height, "📏");
  add("عمق الألوان", screen.colorDepth + " bit", "🎨");
  add("اتجاه الشاشة", screen.orientation?.type, "🔄");
  add("الوقت", new Date().toLocaleString(), "⏰");
  add("بروتوكول الأمان", location.protocol, "🔒");
  add("دعم اللمس", n.maxTouchPoints > 0 ? "نعم" : "غير مكتشف", "✋");

  if (n.getBattery) {
    try {
      const b = await n.getBattery();
      add("شحن البطارية", Math.round(b.level * 100) + "%", "🔋");
      add("هل الجهاز يشحن؟", b.charging ? "نعم" : "لا", "⚡");
    } catch {
      add("البطارية", "غير متاحة", "🔋");
    }
  } else {
    add("البطارية", "غير متاحة في هذا المتصفح", "🔋");
  }

  add("نوع الشبكة", n.connection?.effectiveType || "غير متاح", "📶");
  add("سرعة الشبكة التقديرية", n.connection?.downlink != null ? n.connection.downlink + " Mbps" : "غير متاحة", "📡");
  add("الذاكرة الداخلية", "غير متاحة من المتصفح", "💾");
  add("البلوتوث", "لا يمكن التأكد منه من هذه الصفحة", "🔵");

  add("عنوان IP والدولة والمدينة", "جارٍ الطلب من خدمة خارجية...", "🌍");
  try {
    const response = await fetch("https://ipwho.is/");
    const d = await response.json();
    if (!d.success) throw new Error();
    add("عنوان IP", d.ip, "🌍");
    add("الدولة", d.country, "🏳️");
    add("المدينة التقريبية", d.city, "🏙️");
  } catch {
    add("عنوان IP والموقع التقريبي", "تعذر الحصول عليهما", "🌍");
  }
}

function getLocation() {
  if (!navigator.geolocation) {
    alert("المتصفح لا يدعم تحديد الموقع.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    p => {
      add("خط العرض", p.coords.latitude, "📍");
      add("خط الطول", p.coords.longitude, "📍");
      add("دقة الموقع بالمتر", p.coords.accuracy, "🌍");
    },
    () => alert("لم يتم السماح بتحديد الموقع أو تعذر الحصول عليه."),
    { enableHighAccuracy: true, timeout: 15000 }
  );
}
</script>
</body>
</html>
